indexmap.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
libloading = "0.9"
serialport = { version = "4", default-features = false }
spidev = "0.7"
gpiocdev = "0.8"
socketcan = { version = "4", default-features = false }
