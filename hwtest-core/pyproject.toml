[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "hwtest-core"
version = "0.1.0"
description = "Core data types and wire protocols for hwtest (Rust, via PyO3)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Unlicense"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "black>=24.0",
    "pylint>=3.0",
    "maturin>=1.9.4,<2",
]

[tool.maturin]
# Rust crate: native/ (bindings) -> ../crates/hwtest-core (implementation)
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "hwtest_core._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pylint.main]
py-version = "3.10"
# Type stubs for the Rust extension have no bodies or docstrings by design.
ignore-patterns = ["^.*\\.pyi$"]
# Let pylint import the compiled extension to see its classes.
extension-pkg-allow-list = ["hwtest_core._native"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",  # Dataclasses often have few methods
    "duplicate-code",          # Re-exports in __init__.py are intentional
]
