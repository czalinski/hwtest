[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hwtest"
version = "0.1.0"
description = "hwtest SDK for writing hardware test cases (the framework itself is Rust, in hwtest-core)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Unlicense"}
dependencies = ["hwtest-core"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0", "black>=24.0", "pylint>=3.0"]

[project.scripts]
hwtest = "hwtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hwtest = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.black]
line-length = 100

[tool.pylint.main]
py-version = "3.10"
extension-pkg-allow-list = ["hwtest_core._native"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]
