[workspace]
resolver = "2"
members = ["crates/hwtest-core", "hwtest-core/native"]
# `cargo test` / `cargo clippy` at the root exercise the pure-Rust crates.
# The PyO3 extension is built by maturin (`pip install -e ./hwtest-core`).
default-members = ["crates/hwtest-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Unlicense"
repository = "https://github.com/czalinski/hwtest"

[workspace.dependencies]
hwtest-core = { path = "crates/hwtest-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
crc32fast = "1"
thiserror = "2"
pyo3 = { version = "0.30", features = ["abi3-py310", "multiple-pymethods"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
